# Every push and pull request: a warning-free build and the unit tests on
# Windows, Linux and macOS. (The GPU tests are #[ignore]d: CI machines have no GPU.)
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
        env:
          RUSTFLAGS: -D warnings
      - name: Unit tests
        run: cargo test --locked
      # Experimental: the GPU tests on the macOS runner's Metal GPU, to catch
      # shader or limit problems specific to Apple GPUs.
      - name: GPU tests (Metal)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: cargo test --locked --bin material_painter -- --ignored --test-threads 1 --skip perf_4k --skip ui_screenshots --skip timing
