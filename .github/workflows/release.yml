# Pushing a version tag (v0.1.0, ...) builds the release on Windows (zip and
# installer) and Linux (tarball), and attaches them to a draft GitHub release
# to review and publish by hand.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --locked
      - name: Build and package
        id: package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.package.outputs.version }}" installer\material-painter.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/MaterialPainter-*-windows-x64.zip
            dist/MaterialPainter-*-setup.exe

  linux:
    # The oldest supported runner, so the build runs on older distributions too (glibc 2.35).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --locked
      - name: Build and package
        run: ./scripts/package.sh
      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/MaterialPainter-*-linux-x64.tar.gz
