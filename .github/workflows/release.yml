# Pushing a version tag (v0.1.0, ...) builds the release, packages a zip and
# a Windows installer, and attaches both to a draft GitHub release to review
# and publish by hand.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --locked
      - name: Build and package
        id: package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.package.outputs.version }}" installer\material-painter.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/MaterialPainter-*-windows-x64.zip
            dist/MaterialPainter-*-setup.exe
